# AIcoSystem GitHub issues — consumed by scripts/bootstrap-board.sh
version: 1

milestones:
  - name: M0 Foundation
    description: Docs, ADRs, workspace, CI, catalog spike
  - name: M1 Read-only scan CLI
    description: Volumes, walker, catalog, aico scan --json
  - name: M2 Duplicates and dual boot
    description: Hash pipeline, NTFS read-only
  - name: M3 Desktop viewer
    description: Tauri UI and IPC
  - name: M4 Reversible cleanup
    description: Journal, trash, Activity UI
  - name: M5 Move and v0.1 release
    description: Symlink move, packaging
  - name: M6 Windows native
    description: Post-v0.1 Windows parity
  - name: Icebox
    description: Future work

epics:
  - key: E-M0
    title: "Epic: M0 Foundation and decisions"
    milestone: M0 Foundation
    labels: [type:epic, priority:p0, platform:both]
  - key: E-M1
    title: "Epic: M1 Read-only scan engine"
    milestone: M1 Read-only scan CLI
    labels: [type:epic, priority:p0, platform:linux]
  - key: E-M2
    title: "Epic: M2 Hashing and foreign NTFS"
    milestone: M2 Duplicates and dual boot
    labels: [type:epic, priority:p0, platform:linux]
  - key: E-M3
    title: "Epic: M3 Desktop viewer"
    milestone: M3 Desktop viewer
    labels: [type:epic, priority:p0, platform:both]
  - key: E-M4
    title: "Epic: M4 Reversible cleanup"
    milestone: M4 Reversible cleanup
    labels: [type:epic, priority:p0, platform:linux]
  - key: E-M5
    title: "Epic: M5 Move with link and release"
    milestone: M5 Move and v0.1 release
    labels: [type:epic, priority:p0, platform:linux]
  - key: E-M6
    title: "Epic: M6 Windows-native operations"
    milestone: M6 Windows native
    labels: [type:epic, priority:p1, platform:windows]
  - key: E-ICE
    title: "Epic: Icebox future work"
    milestone: Icebox
    labels: [type:epic, priority:p2, platform:both]

