name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-core:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: dnf install -y rust cargo gcc && rustup default stable
      - name: Build workspace (no Tauri link test)
        run: |
          cargo build -p aico-core -p aico-platform -p aico-ops -p aico-cli
          cargo test -p aico-core -p aico-ops -- --nocapture

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build crates
        run: cargo build -p aico-core -p aico-platform -p aico-ops -p aico-cli

  tauri-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Frontend install
        working-directory: apps/desktop
        run: npm ci || npm install
      - name: Build Tauri
        run: cargo build -p aicosystem-desktop
        continue-on-error: true
